x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE:-fuzalov/bozor-app:latest}
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ${APP_CONTAINER_NAME:-bozor-app}
    restart: always
    logging: *default-logging
    working_dir: /var/www/html
    environment:
      APP_NAME: ${APP_NAME:-Bozor}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-single}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-public}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_URL: ${AWS_URL:-}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Bozor}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_EHLO_DOMAIN: ${MAIL_EHLO_DOMAIN:-bazaarjapan.link}
      MAIL_SENDMAIL_PATH: ${MAIL_SENDMAIL_PATH:-}
      MAIL_LOG_CHANNEL: ${MAIL_LOG_CHANNEL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    expose:
      - "80"
    volumes:
      - app_public_storage:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs
      - ./docker/nginx/default.conf:/etc/nginx/http.d/default.conf:ro
      - ./docker/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bozor
      - bozor_public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: ${CADDY_CONTAINER_NAME:-bozor-caddy}
    restart: always
    logging: *default-logging
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      APP_UPSTREAM: ${APP_UPSTREAM:-bozor-app:80}
      STAGING_APP_DOMAIN: ${STAGING_APP_DOMAIN:-staging.bazaarjapan.link}
      STAGING_APP_UPSTREAM: ${STAGING_APP_UPSTREAM:-bozor-staging-app:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - bozor
      - bozor_public

  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-bozor-postgres}
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bozor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-bozor-redis}
    restart: always
    logging: *default-logging
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - bozor
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_public_storage:
    driver: local
  app_logs:
    driver: local

networks:
  bozor:
    driver: bridge
  bozor_public:
    name: ${PUBLIC_NETWORK_NAME:-bozor-public}
    external: true
